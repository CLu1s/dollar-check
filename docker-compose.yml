name: dollar-check

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: dollar-check:latest
    container_name: dollar-check
    restart: unless-stopped

    # Reaper de PID 1: recoge los procesos zombie de los Bun.spawn de /analyze
    # y asegura que SIGTERM llegue limpio al graceful shutdown de index.ts.
    init: true

    env_file:
      - .env

    environment:
      # Fuerza la ruta del SQLite dentro del volumen (gana sobre env_file).
      DB_PATH: /app/data/dollar-check.db

    volumes:
      # Named volume, NO bind mount. En Linux un bind mount obliga a que el uid
      # del host coincida con el del contenedor (bun = 1000); el named volume
      # hereda el owner de la imagen y funciona igual en cualquier VPS.
      # Backup y restore: scripts/backup.sh y scripts/restore.sh
      - dollar-check-data:/app/data

    # ---- Hardening ----
    # El rootfs es inmutable: solo el volumen de datos y /tmp son escribibles.
    # /tmp lo necesita /analyze para dejar el prompt temporal.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # ---- Limites para un VPS chico ----
    mem_limit: 512m
    pids_limit: 512

    # index.ts cierra bot + db en SIGTERM; dale margen para hacer checkpoint.
    stop_grace_period: 20s

    # Sin rotacion, los logs se comen el disco del VPS en semanas.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dollar-check-data:
    # Nombre fijo (sin prefijo del proyecto) para que los comandos de backup
    # sean siempre los mismos.
    name: dollar-check-data
